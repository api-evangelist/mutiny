standards:
- id: mcp
  name: Model Context Protocol
  conforms: true
  evidence: >-
    Mutiny operates a first-party hosted MCP server at https://mcp.mutinyhq.com/mcp over the streamable
    HTTP transport. POST /mcp answers JSON-RPC 2.0; GET /mcp returns JSON-RPC error -32000 stating that
    server-initiated streaming is not supported and that clients must use stateless POST. Documented
    for Claude web, Claude Desktop and Claude Code in Mutiny's help centre.
  verified: probed 2026-08-13
- id: jsonrpc-2.0
  name: JSON-RPC 2.0
  conforms: true
  evidence: >-
    Every observed MCP response is a well-formed JSON-RPC 2.0 envelope with jsonrpc/error/id members
    (errors -32001 and -32000 observed).
  verified: probed 2026-08-13
- id: oauth2
  name: OAuth 2.0 / 2.1 authorization code
  conforms: true
  evidence: >-
    response_types_supported ["code"], grant_types_supported ["authorization_code"], with authorize and
    token endpoints published in the authorization-server metadata.
  verified: probed 2026-08-13
- id: rfc7636
  name: PKCE (Proof Key for Code Exchange)
  conforms: true
  evidence: code_challenge_methods_supported ["S256"] — the plain method is not offered.
  verified: probed 2026-08-13
- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata
  conforms: true
  evidence: >-
    https://mcp.mutinyhq.com/.well-known/oauth-authorization-server returns HTTP 200 application/json
    with issuer, authorization_endpoint, token_endpoint, registration_endpoint, response_types_supported,
    grant_types_supported, code_challenge_methods_supported, token_endpoint_auth_methods_supported and
    scopes_supported. Saved verbatim at well-known/mutiny-mcp-oauth-authorization-server.json.
  verified: probed 2026-08-13
- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata
  conforms: partial
  evidence: >-
    https://mcp.mutinyhq.com/.well-known/oauth-protected-resource returns HTTP 200 with resource,
    authorization_servers and scopes_supported. However the 401 from POST /mcp carries no
    WWW-Authenticate challenge pointing at that metadata, which is the discovery affordance RFC 9728
    exists to provide — the document is served but not advertised.
  verified: probed 2026-08-13
- id: rfc7591
  name: OAuth 2.0 Dynamic Client Registration
  conforms: true
  evidence: registration_endpoint https://mcp.mutinyhq.com/oauth/register is published in the metadata.
  verified: probed 2026-08-13
