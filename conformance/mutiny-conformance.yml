compliance:
  source: https://www.mutinyhq.com/dpa
  method: searched
  certifications:
  - name: SOC 2 Type II
    status: achieved-or-pursuing
    evidence: >-
      Mutiny's Data Processing Addendum states it "has achieved or is pursuing the following
      certifications: SOC 2 Type II" and that on written request it makes available up-to-date
      third-party audit reports and certifications, "including SOC 2 Type II reports and ISO 27001
      certificates, where available".
  regulations:
  - GDPR (Regulation (EU) 2016/679)
  - UK GDPR / Data Protection Act 2018
  - CCPA / CPRA
  - Swiss FADP
  controls:
  - Data in transit encrypted using TLS 1.2 or higher
  - Data at rest encrypted using AES-256 or equivalent
  - Encryption keys managed through AWS KMS
  - Role-based access control (RBAC)
  - Multi-factor authentication required for access to production systems
  - Breach notification within forty-eight (48) hours of becoming aware
  - RTO 4 hours, RPO 1 hour
  - Sub-processor list maintained at https://www.mutinyhq.com/dpa with 30 days' prior written notice of change
  privacy_contact: privacy@mutinyhq.com
  note: >-
    Mutiny publishes no trust centre, no dedicated security page (/security and /trust both 404) and no
