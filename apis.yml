aid: mutiny
name: Mutiny
description: >-
  Mutiny (mutinyhq.com) is the GTM assistant built for customer-facing work and workflow automation —
  vertical AI built specifically for sales execution. Founded in 2018 as part of Y Combinator's S18 batch
  by Jaleh Rezaei (CEO) and Nikhil Mathew (CTO) and headquartered in New York City, Mutiny helps B2B
  revenue teams generate on-brand, deal-ready assets (self-updating deal rooms, pitch decks, pricing
  proposals, business cases, competitive comparisons, and AI-generated ABM campaigns) and automate the
  repetitive work around deals through agents, skills, and routines. The platform advertises Model Context
  Protocol (MCP) interoperability with Claude and other MCP-compatible tools and integrates with common GTM
  systems (CRM, email, the wider revenue stack). It is used by revenue teams at Snowflake, Uber, Rippling,
  GitLab, Figma, and BMC. Mutiny has raised $72M from Sequoia Capital, Insight Partners, Tiger Global,
  Cowboy Ventures, and Y Combinator. Note: Mutiny publishes no public REST API, OpenAPI, or developer
  portal at this time — this profile captures its identity, provider-authored LLM information, and probed
  security posture. (Its earlier website-personalization / A/B-testing product has been retired.)
