apis:
- aid: mutiny:mutiny-mcp-server
  name: Mutiny MCP Server
  description: >-
    Mutiny's first-party hosted, remote Model Context Protocol server — the company's only
    machine-callable surface. It lets an MCP-compatible assistant (Claude web, Claude Desktop, Claude
    Code, ChatGPT) create Mutiny customer-facing assets from templates and conversation context,
    iterate on them, publish them to a live shareable URL, and search, upload and tag items in the
    workspace content library. Transport is streamable HTTP, stateless POST only; authorization is
    OAuth 2.1 authorization-code with mandatory PKCE (S256) and RFC 7591 dynamic client registration,
    across five published scopes. The live tools/list manifest is auth-gated.
  humanURL: https://help.mutinyhq.com/articles/5003451538-connecting-mutiny-to-claude
  baseURL: https://mcp.mutinyhq.com/mcp
